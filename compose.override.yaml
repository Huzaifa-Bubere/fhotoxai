services:
  general-api:
    environment:
      FRONTEND_URL: http://localhost:5173
      CLUSTERING_QUEUE_MODE: local
      AI_PROCESSING_API_URL: http://ai-api:5001/processing/start
      AWS_EC2_METADATA_DISABLED: "true"
      SMTP_SERVER: localhost
      SMTP_PORT: "1025"
      MAIL_USERNAME: local
      MAIL_PASSWORD: local
    volumes:
      - insightface-cache:/root/.insightface
      - torch-cache:/root/.cache/torch

  ai-api:
    environment:
      FRONTEND_URL: http://localhost:5173
      CLUSTERING_QUEUE_MODE: local
      AI_API_ENABLE_SQS_WORKER: "false"
      AWS_EC2_METADATA_DISABLED: "true"
      SMTP_SERVER: localhost
      SMTP_PORT: "1025"
      MAIL_USERNAME: local
      MAIL_PASSWORD: local
    volumes:
      - insightface-cache:/root/.insightface
      - torch-cache:/root/.cache/torch

volumes:
  insightface-cache:
  torch-cache: